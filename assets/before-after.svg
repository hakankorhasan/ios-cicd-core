<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" height="430">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="430" rx="16" fill="#070a13" />

  <!-- LEFT CARD: 120+ Lines Repetitive -->
  <g transform="translate(30, 25)" filter="url(#shadow)">
    <rect width="455" height="380" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Title Bar -->
    <path d="M 0,12 A 12,12 0 0,1 12,0 L 443,0 A 12,12 0 0,1 455,12 L 455,38 L 0,38 Z" fill="#1e293b" />
    <line x1="0" y1="38" x2="455" y2="38" stroke="#334155" stroke-width="1" />
    
    <!-- Mac Window Dots -->
    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#10b981" />
    <text x="76" y="24" font-family="-apple-system, SF Mono, Menlo, monospace" font-size="12" font-weight="600" fill="#94a3b8">deploy.yml &amp; Fastfile (Repetitive)</text>
    
    <!-- Badge -->
    <rect x="300" y="8" width="142" height="22" rx="5" fill="#450a0a" stroke="#b91c1c" stroke-width="1" />
    <text x="371" y="23" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">❌ 120+ Lines / Repo</text>

    <!-- Code -->
    <g transform="translate(20, 60)" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">
      <text x="0" y="16" fill="#64748b" font-style="italic"># 1. Duplicated in every app repo...</text>
      <text x="0" y="38" fill="#c084fc" font-weight="700">jobs:</text>
      <text x="15" y="58" fill="#c084fc" font-weight="700">build:</text>
      <text x="30" y="78" fill="#f8fafc"><tspan fill="#c084fc">runs-on:</tspan> macos-latest</text>
      <text x="30" y="98" fill="#c084fc" font-weight="700">steps:</text>
      <text x="30" y="118" fill="#f87171">- uses: actions/cache@v3 (manual SPM config)</text>
      <text x="30" y="138" fill="#f87171">- uses: ruby/setup-ruby@v1 (ruby 3.2)</text>
      <text x="30" y="158" fill="#f87171">- run: gem install bundler &amp;&amp; bundle install</text>
      <text x="0" y="182" fill="#64748b" font-style="italic"># 2. Hardcoded Fastlane signing &amp; archive</text>
      <text x="30" y="202" fill="#f87171">- run: bundle exec fastlane deploy_app</text>
      <text x="45" y="222" fill="#ef4444" fill-opacity="0.85"># match(type: "appstore", app_id: "com...")</text>
      <text x="45" y="242" fill="#ef4444" fill-opacity="0.85"># gym(scheme: "App", export_method: "app-store")</text>
      <text x="45" y="262" fill="#ef4444" fill-opacity="0.85"># pilot(skip_waiting_for_build: true)</text>
      <text x="45" y="282" fill="#ef4444" fill-opacity="0.85"># curl -X POST https://slack... (raw json payload)</text>
      <text x="0" y="306" fill="#fbbf24" font-weight="700">⚠️ Changing 1 rule breaks 10 repos!</text>
    </g>
  </g>

  <!-- RIGHT CARD: 5 Lines Plug & Play (SUPER VIBRANT & HIGH CONTRAST) -->
  <g transform="translate(515, 25)" filter="url(#shadow)">
    <rect width="455" height="380" rx="12" fill="#091122" stroke="#10b981" stroke-width="2" />
    
    <!-- Title Bar -->
    <path d="M 0,12 A 12,12 0 0,1 12,0 L 443,0 A 12,12 0 0,1 455,12 L 455,38 L 0,38 Z" fill="#132038" />
    <line x1="0" y1="38" x2="455" y2="38" stroke="#1e293b" stroke-width="1" />
    
    <!-- Mac Window Dots -->
    <circle cx="20" cy="19" r="6" fill="#ef4444" />
    <circle cx="38" cy="19" r="6" fill="#f59e0b" />
    <circle cx="56" cy="19" r="6" fill="#10b981" />
    <text x="76" y="24" font-family="-apple-system, SF Mono, Menlo, monospace" font-size="12" font-weight="600" fill="#94a3b8">fastlane/Fastfile (Target App)</text>
    
    <!-- Badge -->
    <rect x="305" y="8" width="137" height="22" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="373" y="23" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">✅ 5 Lines / 100% DRY</text>

    <!-- Code (DIRECT FILLS ON TEXT ELEMENTS FOR 100% CLARITY) -->
    <g transform="translate(20, 60)" font-family="SF Mono, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
      <text x="0" y="16" fill="#38bdf8" font-style="italic"># 🚀 Centralized engine import (1 line)</text>
      
      <text x="0" y="44" fill="#facc15" font-weight="700">import_from_git(</text>
      <text x="20" y="68" fill="#38bdf8">url: "hakankorhasan/ios-cicd-core",</text>
      <text x="20" y="92" fill="#38bdf8">tag: "v1.3.0"</text>
      <text x="0" y="116" fill="#f8fafc">)</text>

      <text x="0" y="150" fill="#38bdf8" font-style="italic"># 📦 One-touch enterprise release</text>
      
      <text x="0" y="176" fill="#c084fc" font-weight="700">lane :release do</text>
      <text x="20" y="202" fill="#facc15" font-weight="700">universal_testflight_deploy(</text>
      <text x="40" y="228" fill="#38bdf8">scheme: "FitlyApp",</text>
      <text x="40" y="254" fill="#38bdf8">bundle_id: "com.hakan.fitly"</text>
      <text x="20" y="280" fill="#f8fafc">)</text>
      <text x="0" y="306" fill="#c084fc" font-weight="700">end</text>
    </g>
  </g>
</svg>
