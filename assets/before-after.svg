<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="420">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .win-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace; font-size: 12px; font-weight: 600; fill: #94a3b8; }
    .badge-bad { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #f87171; }
    .badge-good { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #34d399; }
    
    .code { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 11.5px; line-height: 1.5; }
    .kw { fill: #c084fc; font-weight: 600; }
    .str { fill: #38bdf8; }
    .fn { fill: #facc15; }
    .comm { fill: #64748b; font-style: italic; }
    .txt { fill: #e2e8f0; }
    .num { fill: #fb923c; }
    .del { fill: #f43f5e; opacity: 0.8; }
    .add { fill: #10b981; }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="420" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" />

  <!-- LEFT CARD: TRADITIONAL APPROACH -->
  <g transform="translate(30, 25)" filter="url(#shadow)">
    <!-- Window Container -->
    <rect width="455" height="370" rx="10" fill="#111827" stroke="#374151" stroke-width="1" />
    
    <!-- Title Bar -->
    <rect width="455" height="36" rx="10" fill="#1f2937" />
    <rect y="26" width="455" height="10" fill="#1f2937" />
    <line x1="0" y1="36" x2="455" y2="36" stroke="#374151" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="18" cy="18" r="5.5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5.5" fill="#f59e0b" />
    <circle cx="54" cy="18" r="5.5" fill="#10b981" />
    <text x="74" y="22" class="win-title">deploy.yml &amp; Fastfile (Repetitive)</text>

    <!-- Badge -->
    <rect x="305" y="8" width="135" height="20" rx="4" fill="#450a0a" stroke="#7f1d1d" />
    <text x="372" y="22" class="badge-bad" text-anchor="middle">❌ 120+ Lines / Repo</text>

    <!-- Code Snippet -->
    <g transform="translate(18, 56)" class="code">
      <text y="15" class="comm"># 1. Duplicated in every app repo...</text>
      <text y="35" class="kw">jobs:</text>
      <text y="55" class="txt">  <tspan class="kw">build:</tspan></text>
      <text y="75" class="txt">    <tspan class="kw">runs-on:</tspan> macos-latest</text>
      <text y="95" class="txt">    <tspan class="kw">steps:</tspan></text>
      <text y="115" class="del">    - uses: actions/cache@v3 (manual SPM config)</text>
      <text y="135" class="del">    - uses: ruby/setup-ruby@v1 (ruby 3.2)</text>
      <text y="155" class="del">    - run: gem install bundler &amp;&amp; bundle install</text>
      <text y="175" class="comm"># 2. Hardcoded Fastlane signing &amp; archive</text>
      <text y="195" class="del">    - run: bundle exec fastlane deploy_app</text>
      <text y="215" class="del">      # match(type: "appstore", app_id: "com...")</text>
      <text y="235" class="del">      # gym(scheme: "App", export_method: "app-store")</text>
      <text y="255" class="del">      # pilot(skip_waiting_for_build: true)</text>
      <text y="275" class="del">      # curl -X POST https://slack... (raw json payload)</text>
      <text y="295" class="comm"># ⚠️ Changing 1 rule breaks 10 repos!</text>
    </g>
  </g>

  <!-- RIGHT CARD: CORE PLUG-AND-PLAY -->
  <g transform="translate(515, 25)" filter="url(#shadow)">
    <!-- Window Container -->
    <rect width="455" height="370" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect width="455" height="36" rx="10" fill="#1e293b" />
    <rect y="26" width="455" height="10" fill="#1e293b" />
    <line x1="0" y1="36" x2="455" y2="36" stroke="#334155" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="18" cy="18" r="5.5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5.5" fill="#f59e0b" />
    <circle cx="54" cy="18" r="5.5" fill="#10b981" />
    <text x="74" y="22" class="win-title">fastlane/Fastfile (Target App)</text>

    <!-- Badge -->
    <rect x="315" y="8" width="125" height="20" rx="4" fill="#064e3b" stroke="#059669" />
    <text x="377" y="22" class="badge-good" text-anchor="middle">✅ 5 Lines / 100% DRY</text>

    <!-- Code Snippet -->
    <g transform="translate(18, 56)" class="code">
      <text y="15" class="comm"># Import centralized engine in 1 line</text>
      <text y="40"><tspan class="fn">import_from_git</tspan>(</text>
      <text y="62">  <tspan class="kw">url:</tspan> <tspan class="str">"hakankorhasan/ios-cicd-core"</tspan>,</text>
      <text y="84">  <tspan class="kw">tag:</tspan> <tspan class="str">"v1.3.0"</tspan></text>
      <text y="106">)</text>
      <text y="135" class="comm"># Ready to deploy any app seamlessly</text>
      <text y="160"><tspan class="kw">lane</tspan> <tspan class="str">:release</tspan> <tspan class="kw">do</tspan></text>
      <text y="185">  <tspan class="fn">universal_testflight_deploy</tspan>(</text>
      <text y="210">    <tspan class="kw">scheme:</tspan> <tspan class="str">"FitlyApp"</tspan>,</text>
      <text y="235">    <tspan class="kw">bundle_id:</tspan> <tspan class="str">"com.hakan.fitly"</tspan></text>
      <text y="260">  )</text>
      <text y="285"><tspan class="kw">end</tspan></text>
    </g>
  </g>
</svg>
