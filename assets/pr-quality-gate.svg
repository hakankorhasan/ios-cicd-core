<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="480">
  <defs>
    <filter id="boxShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .gh-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .gh-header-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .gh-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .gh-username { font-weight: 600; font-size: 14px; fill: #e6edf3; }
    .gh-subtext { font-size: 13px; fill: #848d97; }
    .gh-badge { font-size: 11px; font-weight: 600; fill: #7d8590; stroke: #30363d; stroke-width: 1; rx: 10; }
    
    .table-header { font-weight: 600; font-size: 13px; fill: #e6edf3; }
    .table-cell { font-size: 13px; fill: #e6edf3; }
    .table-code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #79c0ff; }
    .table-row-border { stroke: #21262d; stroke-width: 1; }
    .badge-pill-pass { fill: #238636; font-size: 11px; font-weight: 600; fill-opacity: 0.2; }
    .badge-text-pass { font-size: 12px; font-weight: 600; fill: #3fb950; }
  </style>

  <!-- Canvas Background -->
  <rect width="920" height="480" fill="#010409" rx="12" />

  <!-- GitHub Comment Card Container -->
  <g transform="translate(40, 30)" filter="url(#boxShadow)">
    <!-- Header -->
    <path d="M 0,10 A 8,8 0 0,1 8,0 L 832,0 A 8,8 0 0,1 840,10 L 840,46 L 0,46 Z" class="gh-header-bg" />
    
    <!-- Bot Avatar Icon -->
    <circle cx="28" cy="23" r="14" fill="#1f6feb" />
    <text x="28" y="28" text-anchor="middle" font-size="14">🤖</text>

    <!-- Header Meta -->
    <text x="52" y="28" class="gh-text gh-username">ios-platform-bot</text>
    
    <!-- Bot Tag -->
    <rect x="175" y="14" width="36" height="18" rx="9" fill="#161b22" stroke="#30363d" />
    <text x="193" y="27" text-anchor="middle" class="gh-text" font-size="10" font-weight="600" fill="#7d8590">BOT</text>
    
    <text x="220" y="28" class="gh-text gh-subtext">commented 2 minutes ago • Automated Quality Gate</text>

    <!-- Body Container -->
    <path d="M 0,46 L 840,46 L 840,410 A 8,8 0 0,1 832,418 L 8,418 A 8,8 0 0,1 0,410 Z" class="gh-bg" />

    <!-- Title inside comment -->
    <text x="24" y="80" class="gh-text" font-size="18" font-weight="700" fill="#e6edf3">🤖 iOS Platform PR Quality Gate</text>

    <!-- Green Passed Banner -->
    <g transform="translate(24, 98)">
      <rect width="792" height="34" rx="6" fill="#238636" fill-opacity="0.15" stroke="#238636" stroke-width="1" />
      <circle cx="20" cy="17" r="6" fill="#3fb950" />
      <text x="36" y="22" class="gh-text" font-size="13" font-weight="700" fill="#3fb950">QUALITY GATE PASSED — Ready for Merge Approval</text>
    </g>

    <!-- Audit Rules Table -->
    <g transform="translate(24, 150)">
      <!-- Table Header Bar -->
      <rect width="792" height="32" fill="#161b22" rx="4" />
      <text x="16" y="21" class="gh-text table-header">Check</text>
      <text x="180" y="21" class="gh-text table-header">Status</text>
      <text x="320" y="21" class="gh-text table-header">Details &amp; Policy Bounds</text>

      <!-- Row 1: PR Size -->
      <line x1="0" y1="32" x2="792" y2="32" class="table-row-border" />
      <text x="16" y="55" class="gh-text table-cell" font-weight="600">PR Size</text>
      <text x="180" y="55" class="gh-text badge-text-pass">🟢 Passed</text>
      <text x="320" y="55" class="table-code">+45 / -12 lines <tspan fill="#848d97">(Strictly under 500 lines limit)</tspan></text>

      <!-- Row 2: Tests Added -->
      <line x1="0" y1="68" x2="792" y2="68" class="table-row-border" />
      <text x="16" y="91" class="gh-text table-cell" font-weight="600">Tests Added</text>
      <text x="180" y="91" class="gh-text badge-text-pass">🟢 Passed</text>
      <text x="320" y="91" class="gh-text table-cell" fill="#848d97">Unit tests detected in <tspan fill="#79c0ff" font-family="monospace">Tests/FitlyAppTests/</tspan></text>

      <!-- Row 3: PR Description -->
      <line x1="0" y1="104" x2="792" y2="104" class="table-row-border" />
      <text x="16" y="127" class="gh-text table-cell" font-weight="600">PR Description</text>
      <text x="180" y="127" class="gh-text badge-text-pass">🟢 Passed</text>
      <text x="320" y="127" class="gh-text table-cell" fill="#848d97">Well-documented description (74 characters)</text>

      <!-- Row 4: WIP Blocker -->
      <line x1="0" y1="140" x2="792" y2="140" class="table-row-border" />
      <text x="16" y="163" class="gh-text table-cell" font-weight="600">WIP Blocker</text>
      <text x="180" y="163" class="gh-text badge-text-pass">🟢 Passed</text>
      <text x="320" y="163" class="gh-text table-cell" fill="#848d97">No WIP/Draft prefix. Pull request ready for review.</text>

      <!-- Row 5: Critical Files -->
      <line x1="0" y1="176" x2="792" y2="176" class="table-row-border" />
      <text x="16" y="199" class="gh-text table-cell" font-weight="600">Critical Files</text>
      <text x="180" y="199" class="gh-text badge-text-pass">🟢 Passed</text>
      <text x="320" y="199" class="gh-text table-cell" fill="#848d97">No changes to Podfile, Package.swift, or Project configs</text>
      <line x1="0" y1="212" x2="792" y2="212" class="table-row-border" />
    </g>

    <!-- Footer Quote -->
    <g transform="translate(24, 380)">
      <text x="0" y="18" class="gh-text" font-size="12" fill="#7d8590">⏱️ Evaluated via <tspan fill="#58a6ff" font-weight="600">ios-cicd-core@v1.3.0</tspan> • Rules: <tspan fill="#79c0ff" font-family="monospace">.github/pr-rules.yml</tspan></text>
    </g>
  </g>
</svg>
