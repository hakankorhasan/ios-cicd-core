<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Pipeline Node Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); letter-spacing: -1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 19px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .pipe-label { font-family: -apple-system, BlinkMacSystemFont, 'SF Mono', Menlo, monospace; font-weight: 600; font-size: 12px; fill: #cbd5e1; }
    .pipe-sub { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 11px; fill: #64748b; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <circle cx="200" cy="100" r="300" fill="url(#glowPurple)" />
  <circle cx="950" cy="260" r="350" fill="url(#glowCyan)" />

  <!-- Subtle Circuit / Grid Dots -->
  <g opacity="0.1" fill="#94a3b8">
    <circle cx="100" cy="60" r="2" /><circle cx="140" cy="60" r="2" /><circle cx="180" cy="60" r="2" />
    <circle cx="100" cy="100" r="2" /><circle cx="140" cy="100" r="2" /><circle cx="180" cy="100" r="2" />
    <circle cx="100" cy="140" r="2" /><circle cx="140" cy="140" r="2" /><circle cx="180" cy="140" r="2" />
  </g>

  <!-- Left Content: Title & Badges -->
  <g transform="translate(80, 85)">
    <!-- Pill Badge -->
    <rect width="210" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.3" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#neonGlow)" />
    <text x="32" y="21" class="badge-text">PLATFORM ENGINEERING</text>

    <!-- Main Heading -->
    <text x="0" y="80" class="title">iOS CI/CD Core</text>
    <text x="0" y="115" class="subtitle">Modular, Plug-and-Play Mobile DevOps as a Service</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 150)">
      <!-- Pill 1 -->
      <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ 5-Line Setup</text>

      <!-- Pill 2 -->
      <rect x="150" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="164" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a855f7">🎯 Reusable Workflows</text>

      <!-- Pill 3 -->
      <rect x="320" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="334" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399">🚀 Auto Changelog</text>
    </g>
  </g>

  <!-- Right Visual: Interactive Pipeline Graph -->
  <g transform="translate(680, 75)">
    <!-- Pipeline Box Container -->
    <rect width="440" height="210" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />

    <!-- Top Window Dots -->
    <circle cx="25" cy="20" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="59" cy="20" r="5" fill="#10b981" opacity="0.8" />
    <text x="80" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">pipeline.matrix.ios-cicd-core</text>

    <!-- Flow Track Line -->
    <line x1="50" y1="110" x2="390" y2="110" stroke="#334155" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="50" y1="110" x2="280" y2="110" stroke="#38bdf8" stroke-width="3" />

    <!-- Node 1: Target App -->
    <g transform="translate(50, 110)">
      <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#fff">📱</text>
      <text x="0" y="38" class="pipe-label" text-anchor="middle">Target App</text>
      <text x="0" y="52" class="pipe-sub" text-anchor="middle">5-Line Fastfile</text>
    </g>

    <!-- Node 2: Core Engine -->
    <g transform="translate(165, 110)">
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" filter="url(#neonGlow)" />
      <text x="0" y="6" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#fff">⚙️</text>
      <text x="0" y="38" class="pipe-label" text-anchor="middle">Core Engine</text>
      <text x="0" y="52" class="pipe-sub" text-anchor="middle">@v1.3.0 (SemVer)</text>
    </g>

    <!-- Node 3: Test & Lint -->
    <g transform="translate(280, 110)">
      <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#fff">🛡️</text>
      <text x="0" y="38" class="pipe-label" text-anchor="middle">Test &amp; Lint</text>
      <text x="0" y="52" class="pipe-sub" text-anchor="middle">Scan + SwiftLint</text>
    </g>

    <!-- Node 4: TestFlight -->
    <g transform="translate(390, 110)">
      <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#fff">🚀</text>
      <text x="0" y="38" class="pipe-label" text-anchor="middle">TestFlight</text>
      <text x="0" y="52" class="pipe-sub" text-anchor="middle">Auto-Deploy</text>
    </g>
  </g>
</svg>
